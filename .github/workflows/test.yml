# The wrapper decides whether a PR is safe to merge, so its own gate is worth having.
#
# No network here: every check is local. The verdict table sources the real function
# rather than a copy, so a rule change that nobody reflected in the table fails here.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: syntax
        run: bash -n scripts/codex-review.sh && bash -n scripts/test-verdict.sh

      - name: shellcheck
        run: shellcheck -S warning scripts/codex-review.sh scripts/test-verdict.sh

      - name: verdict table
        run: bash scripts/test-verdict.sh
